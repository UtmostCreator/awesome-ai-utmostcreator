# Agent Assessment Values — SOURCE FILE (D3a)
#
# Human-authored upstream source for the per-agent `agent_assessment` block.
# Validated by schemas/ai/agent-assessment-values.schema.json and enforced by
# tools/ai/validate-agent-assessment-values.php.
#
# CONTRACT (D3a):
# - Keyed by CANONICAL agent TEMPLATE key (the basename under
#   packages/ai-universal-rules/templates/{core,optional}/agents/<key>.md),
#   NEVER by a generated display name.
# - Categorical values only: `risk_level` + `decision`. No numeric fields in v1.
# - `rationale` is SOURCE-ONLY and must never be rendered into frontmatter.
# - `risk_level` mirrors the existing docs/ai/AGENTS-MANIFEST.md Risk column
#   (same low|medium|high|critical vocabulary — identity mapping, not invented).
#
# APPROVAL GATE:
#   `approved: false` means these are DRAFT review input. The renderer (D3b) must
#   NOT consume this file until a human reviews the categorical values and flips
#   `approved` to true. `decision` values below are draft candidates pending that
#   human approval.

schema: ai.agent_assessment.values/v1
approved: true # approved by user 2026-07-05, including bootstrapper/ui-builder REVIEW NEEDED entries

agents:
  agent-creator:
    agent_assessment:
      risk_level: high
      decision: approve_with_minor_fixes
    rationale: "Produces AgentSpec JSON; no mutation, but output influences future agents. Manifest risk: high."
  agent-creator-static-validator:
    agent_assessment:
      risk_level: medium
      decision: needs_refactor
    rationale: "Mission requires running validator, but the rendered surface has no execute tool; reconcile capability vs mission."
  agent-creator-semantic-verifier:
    agent_assessment:
      risk_level: medium
      decision: approve_with_minor_fixes
    rationale: "Read-only semantic review role; acceptable if validator execution claims are clear."
  agent-creator-runtime-guardian:
    agent_assessment:
      risk_level: critical
      decision: approve_with_minor_fixes
    rationale: "Read-only guardrail design role; wording should not imply unsupported execution. Manifest risk: critical (runtime-safety gate)."
  agent-creator-supervisor:
    agent_assessment:
      risk_level: high
      decision: approve_with_minor_fixes
    rationale: "Coordinator role is coherent, but subagent routing semantics must match provider reality. Manifest risk: high."
  agent-critic:
    agent_assessment:
      risk_level: medium
      decision: approve_with_minor_fixes
    rationale: "Read-only agent-file auditor (edit and task denied, deny-by-default bash allowlist); no mutation surface, but audits permission/governance agent files, so domain-influence risk lifts it above low. Self-audit found minor findings outstanding (soft-max length), so decision mirrors the file's own scoring rules. Manifest risk: medium (mirrors workflow-auditor)."
  agent-fleet-assessor:
    agent_assessment:
      risk_level: low
      decision: approve_with_minor_fixes
    rationale: "Read-only fleet orchestrator; edit denied, task: ask to delegate per-file critique to agent-critic. No mutation surface. Matches the agent's authored frontmatter block. Manifest risk: low."
  architect:
    agent_assessment:
      risk_level: high
      decision: approve
    rationale: "Read-only planning role with strong boundaries, ACs, source-of-truth, and handoff discipline. Manifest risk: high (planning gate)."
  architecture-plan-writer:
    agent_assessment:
      risk_level: medium
      decision: approve
    rationale: "Writes only Markdown under docs/tickets; path ACL is self-enforced plus external guard."
  bootstrapper:
    agent_assessment:
      risk_level: high
      decision: needs_refactor
    rationale: "REVIEW NEEDED (not in original draft table): INTERNAL kit-install orchestration, mutating, OpenCode-only. Manifest risk: high. Human must confirm decision."
  bugfix:
    agent_assessment:
      risk_level: medium
      decision: needs_refactor
    rationale: "Mission says fix/apply changes; rendered surface posture must match. Manifest risk: medium."
  build-config:
