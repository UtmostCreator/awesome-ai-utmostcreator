      risk_level: high
      decision: approve_with_minor_fixes
    rationale: "Write/execute capable; coherent but high-risk. Manifest risk: high."
  docs:
    agent_assessment:
      risk_level: low
      decision: needs_refactor
    rationale: "Mission says update docs; rendered surface posture must match. Manifest risk: low."
  implementer:
    agent_assessment:
      risk_level: high
