# Agent Assessment Values — SOURCE FILE (D3a)
#
# Human-authored upstream source for the per-agent `agent_assessment` block.
# Validated by schemas/ai/agent-assessment-values.schema.json and enforced by
# tools/ai/validate-agent-assessment-values.php.
#
# CONTRACT (D3a):
# - Keyed by CANONICAL agent TEMPLATE key (the basename under
#   packages/ai-universal-rules/templates/{core,optional}/agents/<key>.md),
#   NEVER by a generated display name.
# - Categorical values only: `risk_level` + `decision`. No numeric fields in v1.
# - `rationale` is SOURCE-ONLY and must never be rendered into frontmatter.
# - `risk_level` mirrors the existing docs/ai/AGENTS-MANIFEST.md Risk column
#   (same low|medium|high|critical vocabulary — identity mapping, not invented).
#
# APPROVAL GATE:
#   `approved: false` means these are DRAFT review input. The renderer (D3b) must
#   NOT consume this file until a human reviews the categorical values and flips
#   `approved` to true. `decision` values below are draft candidates pending that
#   human approval.

schema: ai.agent_assessment.values/v1
approved: true # approved by user 2026-07-05, including bootstrapper/ui-builder REVIEW NEEDED entries

