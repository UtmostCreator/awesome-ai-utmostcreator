# GENERATED-EDITABLE: canonical installer pack registry data.
# Edited by hand; loaded by tools/ai/install/registry-loader.php and
# normalized by aiInstallerRegistryEntry(). One entry per pack list item:
# a bare string means source==target with all defaults; a map overrides
# target/type/core/merge_strategy/required or adds install_type etc.
adapter-copilot:
